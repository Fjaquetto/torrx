name: security

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    paths:
      - Cargo.lock
      - deny.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: rustsec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
