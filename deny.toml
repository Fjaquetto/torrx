[graph]
all-features = false
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ringbuf 0.4.8 is pulled in by librqbit-utp 0.7.0, which pins `^0.4` and is
    # the newest release; the fix (0.5.2) cannot be selected by Cargo. The bug
    # only triggers when a consumed element's `Drop` panics, and the torrx
    # listener runs in TCP-only mode, so that code path is not exercised.
    # Tracked upstream: https://github.com/agerasev/ringbuf/pull/60
    { id = "RUSTSEC-2026-0293", reason = "no compatible release of librqbit-utp yet; uTP path unused (TCP-only listener)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# CDLA-Permissive-2.0 covers the CA certificate data in webpki-root-certs.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
